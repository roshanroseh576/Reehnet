<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121B2E">
  <meta name="robots" content="noindex, nofollow">
  <title>Reeh Cloud Admin</title>
  <link rel="stylesheet" href="manage.css">
</head>
<body>

<div id="boot" class="boot"><div class="spinner"></div></div>

<!-- Admin app -->
<div id="app" class="app" hidden>
  <header class="topbar">
    <h1 id="title">Orders</h1>
    <a class="icon-btn" href="index.html" aria-label="Home" title="Home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg></a>
  </header>

  <main id="content" class="content"></main>

  <button class="fab" id="fab" hidden aria-label="Add">+</button>

  <nav class="nav" id="nav">
    <button data-tab="orders" class="on"><svg viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Orders</span><i class="dot" id="b-orders" hidden></i></button>
    <button data-tab="users"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21c.8-4 3.5-6 7-6s6.2 2 7 6"/><path d="M17 4.5a3.5 3.5 0 0 1 0 7M22 21c-.4-2.5-1.7-4.2-3.5-5"/></svg><span>Users</span><i class="dot" id="b-users" hidden></i></button>
    <button data-tab="packages"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg><span>Packages</span></button>
    <button data-tab="offers"><svg viewBox="0 0 24 24"><path d="M20 12l-8 8-9-9V3h8l9 9z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg><span>Offers</span></button>
    <button data-tab="banners"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg><span>Banners</span></button>
  </nav>
</div>

<script type="module" src="manage.js"></script>
</body>
</html>
