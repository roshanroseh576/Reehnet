<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5C6FFF">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Payment</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="payment-process.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <h1>Payment</h1>
  </header>

  <main class="pay-body" id="body" hidden>
    <section class="card">
      <h3>Package details</h3>
      <dl class="rows" id="pkg-rows"></dl>
    </section>

    <section class="card">
      <h3>Bank details</h3>
      <p class="muted small">Bank transfer only.</p>
      <dl class="rows" id="bank-rows"></dl>
    </section>

    <section class="card ref">
      <h3>Remarks / Reference</h3>
      <p class="muted small">Enter this exactly when you make the bank transfer.</p>
      <div class="ref-row"><b id="ref">-</b><button class="btn btn-ghost btn-sm" id="copy-ref">Copy</button></div>
    </section>

    <section class="card" id="slip-card">
      <h3>Payment slip</h3>
      <input type="file" id="slip" accept="image/*" hidden>
      <button class="slip-drop" id="slip-pick" type="button">
        <span id="slip-hint">Tap to upload your slip photo</span>
        <img id="slip-preview" alt="Payment slip preview" hidden>
      </button>
    </section>

    <div class="pay-actions" id="actions">
      <button class="btn btn-primary btn-block" id="paid" disabled>OK, I'm paid</button>
      <button class="btn btn-danger btn-block" id="cancel">Cancel order</button>
    </div>
    <p class="notice" id="notice" hidden>Your payment is being verified. We will activate your package once it is confirmed.</p>
  </main>

  <div class="empty" id="loading"><div class="spinner" style="margin:0 auto"></div></div>
</div>
<script type="module" src="payment-process.js"></script>
</body>
</html>
