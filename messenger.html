<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5C6FFF">
  <title>Support</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="messenger.css">
</head>
<body>
<div class="app chat-app">
  <header class="topbar" id="top-bar">
    <button class="icon-btn" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <div class="head-text"><h1>Support</h1><small id="status-line">Type "Hi" to start</small></div>
    <a class="me-chip" id="me" href="profile.html" aria-label="My profile">
      <span class="me-av" id="me-av">R</span>
      <span class="me-text"><b id="me-name">-</b><small id="me-phone"></small></span>
    </a>
  </header>

  <header class="topbar sel-bar" id="sel-bar" hidden>
    <button class="icon-btn" id="sel-cancel" aria-label="Cancel selection"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h1 id="sel-count">0 selected</h1>
    <button class="btn btn-ghost btn-sm" id="sel-all">Select all</button>
    <button class="icon-btn" id="sel-copy" aria-label="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
    <button class="icon-btn danger" id="sel-del" aria-label="Delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </header>

  <div class="banner-state" id="banner" hidden></div>

  <main class="msgs" id="msgs" aria-live="polite">
    <div class="empty" id="empty">Type <b>Hi</b> to start chatting.</div>
  </main>

  <form class="composer" id="composer" autocomplete="off">
    <input class="input" id="text" type="text" placeholder="Type a message" maxlength="500" enterkeyhint="send">
    <button class="send" type="submit" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
</div>
<script type="module" src="messenger.js"></script>
</body>
</html>
