<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5C6FFF">
  <title>Notifications</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="notifications.css">
</head>
<body>
<div class="app">
  <header class="topbar" id="top-bar">
    <button class="icon-btn" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <h1>Notifications</h1>
  </header>

  <header class="topbar sel-bar" id="sel-bar" hidden>
    <button class="icon-btn" id="sel-cancel" aria-label="Cancel selection">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <h1 id="sel-count">0 selected</h1>
    <button class="btn btn-ghost btn-sm" id="sel-all">Select all</button>
    <button class="icon-btn" id="sel-copy" aria-label="Copy">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
    </button>
    <button class="icon-btn danger" id="sel-del" aria-label="Delete">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
    </button>
  </header>

  <div class="perm-banner" id="perm-banner" hidden>
    <span id="perm-text">Turn on notifications to get updates even when the app is closed.</span>
    <button class="btn btn-primary btn-sm" id="perm-btn">Turn on</button>
  </div>

  <main class="nt-body">
    <div id="list"></div>
    <div id="sentinel" class="sentinel"></div>
    <p class="hold-hint" id="hint" hidden>Press and hold a notification to select or delete it.</p>
  </main>
</div>
<script type="module" src="notifications.js"></script>
</body>
</html>
