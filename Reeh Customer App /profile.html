<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5C6FFF">
  <title>Profile</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="profile.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-btn" id="back" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    </button>
    <h1>Profile</h1>
  </header>

  <main class="prof-body">
    <!-- tap the photo / name / phone -> profile-edit.html ; the pencil -> photo options -->
    <section class="p-top">
      <div class="av-wrap">
        <a class="avatar-lg" id="avatar" href="profile-edit.html" aria-label="Open profile"><span>R</span></a>
        <button class="edit-badge" id="edit-photo" aria-label="Edit photo">
          <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        </button>
      </div>
      <a class="p-info" href="profile-edit.html"><b id="p-name">-</b><span id="p-phone">-</span></a>
    </section>

    <section class="more-sec" id="more-sec">
      <h3 class="sec-title">More</h3>
      <div class="more-grid" id="more-grid"></div>
    </section>

    <section class="menu" id="menu"></section>
  </main>

  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>
<script type="module" src="profile.js"></script>
</body>
</html>
